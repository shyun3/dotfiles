min_version = "2026.10.9"  # ppa

[bootstrap.files."/etc/wsl.conf"]
# WSL needs to be restarted to apply configuration updates
# See https://learn.microsoft.com/en-us/windows/wsl/wsl-config#the-8-second-rule-for-configuration-changes
source = "../rc/etc/wsl.conf"
owner = "root"
group = "root"

[bootstrap.files."/usr/lib/binfmt.d/WSLInterop.conf"]
# Taken from https://github.com/microsoft/WSL/issues/8843#issuecomment-1337127239
source = "../rc/usr/lib/binfmt.d/WSLInterop.conf"
owner = "root"
group = "root"

[bootstrap.apt.sources.wslutilities]
# Taken from https://launchpad.net/~wslutilities/+archive/ubuntu/wslu
uris = "https://ppa.launchpadcontent.net/wslutilities/wslu/ubuntu"
suites = "noble"
key = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x254f460f2970e18123046570c1d0e7e6ab4095d6"
fingerprint = "254F460F2970E18123046570C1D0E7E6AB4095D6"

[bootstrap.packages]
"apt:wslu" = "latest"  # For `wslview`
