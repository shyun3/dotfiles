#:schema https://mise.jdx.dev/schema/mise.json

# Remember that all entries in this global config should be valid for all
# environments/platforms

[min_version]
hard = "2026.7.4"  # bootstrap
soft = "2026.8.13"  # conf.d environments

[settings]
dotfiles.root = "~/.config/mise/rc"
dotfiles.default_mode = "copy"
use_versions_host_track = false

[dotfiles]
"~/.config/git/ignore" = {}
"~/.gitconfig" = {}
