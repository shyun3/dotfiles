#:schema https://mise.jdx.dev/schema/mise.json

[settings]
color_theme = "catppuccin"
lockfile = true
lockfile_platforms = ["linux-x64"]
unix_default_inline_shell_args = "bash -c -o errexit"

[env]
VISUAL = "nvim"

[shell_alias]
cdgitroot = 'cd "$(git rev-parse --show-cdup)"'
lg = "lazygit"
y = "yazi"

[bootstrap.packages]
# Guidelines for inclusion:
# - Not present in mise
# - Don't care about version updates
# - Requires installation in system directories
"apt:inotify-tools" = "latest"  # For Neovim LSP
"apt:update-notifier-common" = "latest"
"apt:wslu" = "latest"  # So that `xdg-open` can open links in Windows browser
"apt:xdg-utils" = "latest"  # Needed for `xdg-open`
"apt:zsh" = "latest"

[bootstrap.repos]
"~/.antidote" = { url = "https://github.com/mattmc3/antidote.git" }

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/bat/config" = {}
"~/.config/fd/ignore" = {}
"~/.config/jj/conf.d/config.toml" = {}
"~/.config/jjui/config.*" = {}
"~/.config/lazygit/config.yml" = {}
"~/.config/nvim/" = { mode = "symlink" }
"~/.config/rumdl/rumdl.toml" = {}
"~/.config/stylua.toml" = {}
"~/.config/tombi/config.toml" = {}
"~/.config/yazi/*.*" = {}
"~/.config/yazi/package.toml" = { mode = "symlink" }
"~/.ctags.d/global.ctags" = {}
"~/.gitconfig-local/unix" = { block = """
[core]
    pager = delta
[interactive]
    diffFilter = delta --color-only
""" }
"~/.p10k.zsh" = {}
"~/.zprofile" = {}
"~/.zsh/" = { mode = "symlink" }
"~/.zsh_plugins.txt" = {}
"~/.zshrc" = {}
